<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#0d0d12"/>
  <rect width="1000" height="420" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">RTL-SDR-Receiver — Signal Chain</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">Receive-only — no transmit stage, no license needed</text>

  <!-- RF source -->
  <path d="M40 200 q20 -30 0 -60 M55 200 q25 -35 0 -70 M70 200 q30 -40 0 -80" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="6" y="235" fill="#4ade80" font-size="10">RF in the air</text>
  <text x="6" y="249" fill="#94a3b8" font-size="9">aircraft, FM, sat, etc.</text>

  <line x1="90" y1="180" x2="150" y2="180" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Antenna -->
  <rect x="150" y="140" width="130" height="80" rx="6" fill="#14141c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="215" y="170" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">Antenna</text>
  <text x="215" y="186" fill="#94a3b8" font-size="9" text-anchor="middle">whip (FM/ADS-B) or</text>
  <text x="215" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">dedicated 1090MHz</text>

  <line x1="280" y1="180" x2="330" y2="180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dongle -->
  <rect x="330" y="140" width="160" height="80" rx="6" fill="#14141c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="410" y="166" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">RTL-SDR dongle</text>
  <text x="410" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">RTL2832U + R820T2</text>
  <text x="410" y="196" fill="#94a3b8" font-size="9" text-anchor="middle">(confirm this chipset, not clone)</text>

  <!-- gap: dongle -> computer, USB extension callout -->
  <line x1="490" y1="180" x2="580" y2="180" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="160" fill="#f97316" font-size="9" text-anchor="middle">USB ext.</text>
  <text x="535" y="205" fill="#94a3b8" font-size="8" text-anchor="middle">keeps dongle away</text>
  <text x="535" y="217" fill="#94a3b8" font-size="8" text-anchor="middle">from PC's RF noise</text>

  <!-- Computer -->
  <rect x="580" y="140" width="160" height="80" rx="6" fill="#14141c" stroke="#f97316" stroke-width="1.5"/>
  <text x="660" y="166" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">Any computer</text>
  <text x="660" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">no Pi required</text>
  <text x="660" y="196" fill="#94a3b8" font-size="9" text-anchor="middle">raw IQ samples over USB</text>

  <line x1="740" y1="180" x2="790" y2="180" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SDR software -->
  <rect x="790" y="120" width="190" height="130" rx="6" fill="#14141c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="885" y="146" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">SDR software</text>
  <text x="885" y="166" fill="#94a3b8" font-size="9" text-anchor="middle">GQRX — general tuning/listen</text>
  <text x="885" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">dump1090 — ADS-B aircraft</text>
  <text x="885" y="198" fill="#94a3b8" font-size="9" text-anchor="middle">rtl_433 — ISM-band sensors</text>
  <text x="885" y="214" fill="#94a3b8" font-size="9" text-anchor="middle">wxtoimg — NOAA weather sat</text>

  <!-- output row -->
  <text x="885" y="278" fill="#e6e6e6" font-size="10" text-anchor="middle" font-weight="600">Decoded output</text>
  <g font-size="9" fill="#94a3b8" text-anchor="middle">
    <text x="800" y="298">Live aircraft</text>
    <text x="800" y="310">positions</text>
    <text x="885" y="298">FM</text>
    <text x="885" y="310">audio</text>
    <text x="965" y="298">Satellite</text>
    <text x="965" y="310">images</text>
  </g>

  <text x="24" y="330" fill="#94a3b8" font-size="10">The cheapest real project in the chain — the budget-tier dongle is genuinely the right answer, not a compromise.</text>
</svg>
